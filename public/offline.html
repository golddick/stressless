<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04110f" />
    <title>stressless — offline</title>
    <style>
      :root {
        --ink: #04110f;
        --mint: #9be8cf;
        --brass: #f0cf8e;
        --text: #f3f7f5;
        --muted: rgba(243,247,245,0.8);
        --edge: rgba(255,255,255,0.18);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, rgba(155,232,207,0.18), transparent 30%), var(--ink);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(560px, 100%);
        padding: 32px 28px;
        border-radius: 28px;
        background: rgba(10, 28, 26, 0.78);
        border: 1px solid var(--edge);
        box-shadow: 0 28px 80px -28px rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(14px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        border: 1px solid rgba(240,207,142,0.4);
        background: rgba(240,207,142,0.08);
        color: var(--brass);
        padding: 7px 12px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2.2rem, 5vw, 3.6rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.05rem;
      }

      .meta {
        margin-top: 22px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--edge);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        font-weight: 700;
        text-decoration: none;
      }

      .pill.primary {
        background: linear-gradient(180deg, #f7e0aa, #e4bd6f);
        border: none;
        color: #2a1f08;
      }

      .spinner {
        display: inline-block;
        width: 1em;
        height: 1em;
        flex: none;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spinner-rotate 0.7s linear infinite;
      }

      .spinner[hidden] { display: none; }

      @keyframes spinner-rotate {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: 1.5s; }
      }

      .pill[aria-busy="true"] { pointer-events: none; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">offline mode</div>
      <h1>stressless is temporarily offline.</h1>
      <p>
        Your connection dropped, but the app is still available. Reconnect to sync your cart, orders,
        and account details, or return to the dashboard when your signal is back.
      </p>

      <div class="meta">
        <a class="pill primary" id="try-again" href="/">
          <span class="spinner" aria-hidden="true" hidden></span>
          <span>Try again</span>
        </a>
        <a class="pill" href="/login">Login</a>
      </div>
    </main>
    <script>
      const tryAgain = document.getElementById('try-again')
      tryAgain.addEventListener('click', event => {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return
        tryAgain.setAttribute('aria-busy', 'true')
        tryAgain.querySelector('.spinner').hidden = false
      })
    </script>
  </body>
</html>
